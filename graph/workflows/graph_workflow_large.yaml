workflow_name: graph_workflow_large

functions:
  - name: graph_gen
    requirements:
      cpu: 500m
      ram: 128Mi
    image: arjiba/profiling:graph_graph_gen

  - name: graph_bft
    requirements:
      cpu: 500m
      ram: 128Mi
    image: arjiba/profiling:graph_graph_bft

  - name: pagerank
    requirements:
      cpu: 500m
      ram: 128Mi
    image: arjiba/profiling:graph_pagerank

  - name: graph_mst
    requirements:
      cpu: 500m
      ram: 128Mi
    image: arjiba/profiling:graph_graph_mst

  - name: aggregate
    requirements:
      cpu: 500m
      ram: 128Mi
    image: arjiba/profiling:graph_aggregate

dependencies:
  - from: graph_gen
    to: graph_bft
    data_size: 1.085006

  - from: graph_gen
    to: pagerank
    data_size: 1.085006

  - from: graph_gen
    to: graph_mst
    data_size: 1.085006

  - from: graph_bft
    to: aggregate
    data_size: 0.001355

  - from: pagerank
    to: aggregate
    data_size: 0.008226

  - from: graph_mst
    to: aggregate
    data_size: 0.002778
