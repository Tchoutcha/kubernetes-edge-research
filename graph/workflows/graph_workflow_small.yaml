workflow_name: graph_workflow_small

functions:
  - name: graph_gen
    requirements:
      cpu: 500m
      ram: 128Mi
    service: graph-graph-gen

  - name: graph_bft
    requirements:
      cpu: 500m
      ram: 128Mi
    service: graph-graph-bft

  - name: pagerank
    requirements:
      cpu: 500m
      ram: 128Mi
    service: graph-pagerank

  - name: graph_mst
    requirements:
      cpu: 500m
      ram: 128Mi
    service: graph-graph-mst

  - name: aggregate
    requirements:
      cpu: 500m
      ram: 128Mi
    service: graph-aggregate

dependencies:
  - from: graph_gen
    to: graph_bft
    data_size: 0.046493

  - from: graph_gen
    to: pagerank
    data_size: 0.046493

  - from: graph_gen
    to: graph_mst
    data_size: 0.046493

  - from: graph_bft
    to: aggregate
    data_size: 0.000264

  - from: pagerank
    to: aggregate
    data_size: 0.001734

  - from: graph_mst
    to: aggregate
    data_size: 0.000562
